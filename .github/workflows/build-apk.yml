name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build SHM and REV debug APKs
        run: gradle --no-daemon :shm:assembleDebug :rev:assembleDebug

      - name: Save SHM and REV APKs
        uses: actions/upload-artifact@v4
        with:
          name: media-share-apks
          path: |
            shm/build/outputs/apk/debug/shm-debug.apk
            rev/build/outputs/apk/debug/rev-debug.apk
          if-no-files-found: error
