name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check Firebase client configuration
        id: firebase-config
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
          FIREBASE_APP_ID_SHM: ${{ vars.FIREBASE_APP_ID_SHM }}
          FIREBASE_APP_ID_REV: ${{ vars.FIREBASE_APP_ID_REV }}
        run: |
          if [[ -z "$FIREBASE_API_KEY" || -z "$FIREBASE_PROJECT_ID" || \
                -z "$FIREBASE_STORAGE_BUCKET" || -z "$FIREBASE_SENDER_ID" || \
                -z "$FIREBASE_APP_ID_SHM" || -z "$FIREBASE_APP_ID_REV" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APKs will compile, but no connected APK artifact will be published until all Firebase Actions variables listed in README.md are configured."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build SHM and REV debug APKs
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
          FIREBASE_APP_ID_SHM: ${{ vars.FIREBASE_APP_ID_SHM }}
          FIREBASE_APP_ID_REV: ${{ vars.FIREBASE_APP_ID_REV }}
        run: gradle --no-daemon :shm:assembleDebug :rev:assembleDebug

      - name: Save SHM and REV APKs
        if: steps.firebase-config.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: media-share-apks
          path: |
            shm/build/outputs/apk/debug/shm-debug.apk
            rev/build/outputs/apk/debug/rev-debug.apk
          if-no-files-found: error
